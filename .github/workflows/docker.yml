name: Validate Docker deployment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose
        run: docker compose --file docker-compose.yaml config --quiet

      - name: Build application image
        run: docker build --tag narrador:test .

      - name: Run unit tests in application image
        run: >-
          docker run --rm --entrypoint python
          --volume "$PWD/tests:/app/tests:ro"
          narrador:test -m unittest discover -s tests -v
