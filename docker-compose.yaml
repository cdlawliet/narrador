services:
  narrador:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      - PORT=8000
      - NARRADOR_OPEN_BROWSER=0
      - SERVICE_FQDN_NARRADOR_8000
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); assert response.status == 200
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
